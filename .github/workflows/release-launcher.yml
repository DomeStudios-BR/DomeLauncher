name: release-launcher

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: [validar-launcher]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versao para lancar (ex: v0.3.3)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-launcher
  cancel-in-progress: false

jobs:
  preparar-release:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.id == github.repository_id)
    runs-on: ubuntu-24.04
    outputs:
      deve_publicar: ${{ steps.verificar.outputs.deve_publicar }}
      versao_tag: ${{ steps.verificar.outputs.versao_tag }}
      corpo_release: ${{ steps.verificar.outputs.corpo_release }}
      commit: ${{ steps.origem.outputs.commit }}
      validado: ${{ steps.origem.outputs.validado }}
      frontend_run_id: ${{ steps.origem.outputs.frontend_run_id }}
    steps:
      - name: Identificar commit e validação existente
        id: origem
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const commit = context.payload.workflow_run?.head_sha ?? context.sha;
            let validado = context.eventName === "workflow_run";
            let validacaoId = context.payload.workflow_run?.id;
            if (!validado) {
              const resposta = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: "validar-launcher.yml", head_sha: commit,
                event: "push", status: "success", per_page: 100
              });
              const aprovada = resposta.data.workflow_runs.find(execucao =>
                execucao.head_sha === commit && execucao.head_branch === "main" &&
                execucao.head_repository?.id === context.payload.repository.id
              );
              validado = Boolean(aprovada);
              validacaoId = aprovada?.id;
            }
            let frontendRunId = "";
            if (validacaoId) {
              const artefatos = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner, repo, run_id: validacaoId
              });
              if (artefatos.some(artefato => artefato.name === "frontend-producao" && !artefato.expired)) {
                frontendRunId = String(validacaoId);
              }
            }
            core.setOutput("commit", commit);
            core.setOutput("validado", String(validado));
            core.setOutput("frontend_run_id", frontendRunId);

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.origem.outputs.commit }}
          fetch-depth: 0

      - name: Verificar gatilho e preparar release
        id: verificar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENTO: ${{ github.event_name }}
          TIPO_REF: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          NOME_REF: ${{ github.ref_name }}
          TAG_MANUAL: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          DEVE_PUBLICAR=false
          TAG=""

          if [ "$EVENTO" = "workflow_dispatch" ]; then
            INPUT_TAG="$TAG_MANUAL"
            if [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
              [[ "$TAG" =~ ^v ]] || TAG="v$TAG"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
            DEVE_PUBLICAR=true
            echo "Disparo manual via workflow_dispatch para tag: $TAG"

          elif [ "$TIPO_REF" = "tag" ] || [[ "$REF" == refs/tags/* ]]; then
            TAG="$NOME_REF"
            DEVE_PUBLICAR=true
            echo "Disparo via push de tag: $TAG"

          elif [ "$EVENTO" = "workflow_run" ]; then
            SUBJECT="$(git log -1 --pretty=%s)"
            MENSAGEM="$(git log -1 --pretty=%B)"
            echo "Subject do commit: $SUBJECT"
            if echo "$SUBJECT" | grep -iqE '^release(\([^)]+\))?:' || echo "$MENSAGEM" | grep -iqE '^release(\([^)]+\))?:'; then
              echo "Commit identificado como release!"
              VERSAO="$(echo "$SUBJECT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
              if [ -z "$VERSAO" ]; then
                VERSAO="$(echo "$MENSAGEM" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
              fi
              if [ -n "$VERSAO" ]; then
                TAG="v$VERSAO"
              else
                TAG="v$(node -p "require('./package.json').version")"
              fi
              DEVE_PUBLICAR=true
              echo "Tag identificada a partir do commit: $TAG"
            else
              echo "Commit comum na main (nao e release). Nenhuma acao necessaria."
              DEVE_PUBLICAR=false
            fi
          fi

          if [ "$DEVE_PUBLICAR" != "true" ]; then
            echo "deve_publicar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag inválida: $TAG. Use o formato v0.0.0."
            exit 1
          fi
          ESPERADA="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          TAURI="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO="$(grep -m1 '^version' src-tauri/Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          echo "Validando manifestos: esperada=$ESPERADA package=$PKG tauri=$TAURI cargo=$CARGO"

          if [ "$PKG" != "$ESPERADA" ] || [ "$TAURI" != "$ESPERADA" ] || [ "$CARGO" != "$ESPERADA" ]; then
            echo "::error::A versao $TAG diverge dos manifestos: package=$PKG, tauri=$TAURI, cargo=$CARGO. Sincronize as 3 versoes antes de lancar a release."
            exit 1
          fi
          RASCUNHO="$(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$EVENTO" != "workflow_dispatch" ] && [ "$RASCUNHO" = "false" ]; then
            echo "A release $TAG ja esta publicada no GitHub Releases. Pulando build duplicado."
            echo "deve_publicar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG nao encontrada no remoto. Criando tag..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Tag $TAG enviada com sucesso para o repositorio."
          else
            if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::A tag $TAG aponta para outro commit. Selecione o commit correspondente."
              exit 1
            fi
            echo "Tag $TAG ja existe no remoto."
          fi

          CORPO="$(git log -1 --pretty=%B)"
          if [ -f ".github/releases/$TAG.md" ]; then
            CORPO="$(cat ".github/releases/$TAG.md")"
          fi
          DELIMITER="EOF_RELEASE_DESC_${RANDOM}"

          echo "deve_publicar=true" >> "$GITHUB_OUTPUT"
          echo "versao_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "corpo_release<<$DELIMITER" >> "$GITHUB_OUTPUT"
          echo "$CORPO" >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"

  compilar:
    needs: preparar-release
    if: needs.preparar-release.outputs.deve_publicar == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: windows
            sistema: windows-latest
            bundles: nsis
          - plataforma: linux
            sistema: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.sistema }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preparar-release.outputs.commit }}

      - name: Instalar dependências do sistema
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libgtk-3-dev librsvg2-dev patchelf file libssl-dev

      - name: Preparar ferramentas e cache
        uses: ./.github/actions/preparar-compilacao
        with:
          perfil: release

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Reutilizar frontend aprovado do mesmo commit
        if: needs.preparar-release.outputs.frontend_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: frontend-producao
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.preparar-release.outputs.frontend_run_id }}

      - name: Auditar dependências
        run: bun audit

      - name: Validar backend quando não houver aprovação do mesmo commit
        if: needs.preparar-release.outputs.validado != 'true'
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Compilar e assinar instaladores
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          projectPath: ./
          tauriScript: bun run tauri --
          args: >-
            --bundles ${{ matrix.bundles }}
            ${{ needs.preparar-release.outputs.frontend_run_id != '' &&
                '--config src-tauri/tauri.ci.conf.json' || '' }}
            -- --locked --timings

      - name: Guardar tempos de compilação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tempos-compilacao-${{ matrix.plataforma }}
          path: src-tauri/target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar instaladores assinados
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.plataforma }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  finalizar-release:
    needs: [preparar-release, compilar]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preparar-release.outputs.commit }}

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Baixar instaladores assinados
        uses: actions/download-artifact@v4
        with:
          pattern: instaladores-*
          path: artefatos
          merge-multiple: true

      - name: Gerar manifesto de atualização
        env:
          VERSAO_TAG: ${{ needs.preparar-release.outputs.versao_tag }}
          CORPO_RELEASE: ${{ needs.preparar-release.outputs.corpo_release }}
        run: |
          bun test scripts/tests/manifesto-atualizacao.test.ts
          bun scripts/gerar-manifesto-atualizacao.ts artefatos

      - name: Publicar release completa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSAO_TAG: ${{ needs.preparar-release.outputs.versao_tag }}
          CORPO_RELEASE: ${{ needs.preparar-release.outputs.corpo_release }}
          COMMIT_RELEASE: ${{ needs.preparar-release.outputs.commit }}
        run: |
          set -euo pipefail
          printf '%s' "$CORPO_RELEASE" > "$RUNNER_TEMP/notas-release.txt"
          if ! gh release view "$VERSAO_TAG" >/dev/null 2>&1; then
            gh release create "$VERSAO_TAG" --draft --verify-tag --target "$COMMIT_RELEASE" \
              --title "Dome Launcher $VERSAO_TAG" --notes-file "$RUNNER_TEMP/notas-release.txt"
          fi
          mapfile -d '' arquivos < <(find artefatos -type f -print0)
          gh release upload "$VERSAO_TAG" "${arquivos[@]}" --clobber
          gh release edit "$VERSAO_TAG" --draft=false --latest \
            --title "Dome Launcher $VERSAO_TAG" --notes-file "$RUNNER_TEMP/notas-release.txt"
