name: validar-launcher

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preparar ferramentas e cache
        uses: ./.github/actions/preparar-compilacao
        with:
          perfil: debug

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Auditar dependências
        run: bun audit

      - name: Validar projeto
        run: bun run verificar

      - name: Validar manifesto de atualização
        run: bun test scripts/tests/manifesto-atualizacao.test.ts

      - name: Guardar frontend aprovado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-producao
          path: dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  validar-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev patchelf file libssl-dev

      - name: Preparar ferramentas e cache
        uses: ./.github/actions/preparar-compilacao
        with:
          perfil: debug

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Auditar dependências
        run: bun audit

      - name: Validar projeto
        run: bun run verificar

      - name: Validar manifesto de atualização
        run: bun test scripts/tests/manifesto-atualizacao.test.ts
