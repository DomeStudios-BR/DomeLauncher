name: auto-release-main

# Cada push na main vira release: extrai a versao do commit
# (ex: "release: Dome Launcher v0.2.3") ou do package.json,
# cria a tag vX.Y.Z e o workflow release-launcher assume a partir dai.
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  etiquetar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extrair versao
        id: versao
        shell: bash
        run: |
          MENSAGEM="$(git log -1 --pretty=%B)"
          echo "Mensagem do commit:"
          echo "$MENSAGEM"
          VERSAO_MSG="$(echo "$MENSAGEM" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          if [ -n "$VERSAO_MSG" ]; then
            echo "Versao encontrada na mensagem: $VERSAO_MSG"
            echo "tag=$VERSAO_MSG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSAO_PKG="v$(node -p "require('./package.json').version")"
          echo "Sem versao na mensagem, usando package.json: $VERSAO_PKG"
          echo "tag=$VERSAO_PKG" >> "$GITHUB_OUTPUT"

      - name: Pular se tag ja existe
        id: existe
        shell: bash
        run: |
          TAG="${{ steps.versao.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "A tag $TAG ja existe no remoto, nada a fazer."
            echo "pular=true" >> "$GITHUB_OUTPUT"
          else
            echo "pular=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validar manifestos sincronizados
        if: steps.existe.outputs.pular == 'false'
        shell: bash
        run: |
          TAG="${{ steps.versao.outputs.tag }}"
          ESPERADA="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          TAURI="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO="$(grep -m1 '^version' src-tauri/Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          echo "tag=$ESPERADA package=$PKG tauri=$TAURI cargo=$CARGO"
          if [ "$PKG" != "$ESPERADA" ] || [ "$TAURI" != "$ESPERADA" ] || [ "$CARGO" != "$ESPERADA" ]; then
            echo "::error::A tag $TAG diverge dos manifestos: package=$PKG, tauri=$TAURI, cargo=$CARGO. Sincronize as 3 versoes antes de mesclar na main."
            exit 1
          fi

      - name: Criar e enviar tag
        if: steps.existe.outputs.pular == 'false'
        shell: bash
        run: |
          TAG="${{ steps.versao.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
