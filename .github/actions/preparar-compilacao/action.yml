name: Preparar compilação
description: Configura ferramentas e caches para validação ou release do launcher.
inputs:
    perfil:
        description: Perfil Cargo a preservar no cache, debug ou release.
        required: true
runs:
    using: composite
    steps:
        - name: Conferir perfil e identificar commit
          id: origem
          shell: bash
          env:
              PERFIL: ${{ inputs.perfil }}
          run: |
              set -euo pipefail
              if [[ "$PERFIL" != "debug" && "$PERFIL" != "release" ]]; then
                  echo "::error::Perfil de compilação inválido: $PERFIL."
                  exit 1
              fi
              printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              {
                  echo "CARGO_INCREMENTAL=0"
                  echo "CARGO_PROFILE_DEV_DEBUG=0"
                  echo "CARGO_PROFILE_TEST_DEBUG=0"
                  echo "SCCACHE_GHA_ENABLED=true"
                  echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
                  echo "RUSTC_WRAPPER=sccache"
              } >> "$GITHUB_ENV"

        - name: Configurar Bun
          uses: oven-sh/setup-bun@v2
          with:
              bun-version: 1.3.5

        - name: Configurar Rust
          uses: dtolnay/rust-toolchain@stable
          with:
              toolchain: 1.99.0
              components: clippy,rustfmt

        - name: Configurar cache de unidades compiladas
          uses: mozilla-actions/sccache-action@v0.0.11
          with:
              version: v0.18.0

        - name: Restaurar pacotes Bun e Cargo
          uses: actions/cache@v4
          with:
              path: |
                  ~/.bun/install/cache
                  ~/.cargo/registry/index
                  ~/.cargo/registry/cache
                  ~/.cargo/git/db
              key: dependencias-v1-${{ runner.os }}-${{ hashFiles('bun.lock', 'src-tauri/Cargo.lock') }}
              restore-keys: |
                  dependencias-v1-${{ runner.os }}-

        - name: Restaurar compilação do perfil
          uses: actions/cache@v4
          with:
              path: |
                  src-tauri/target/${{ inputs.perfil }}
                  !src-tauri/target/${{ inputs.perfil }}/bundle
                  !src-tauri/target/${{ inputs.perfil }}/incremental
              key: >-
                  rust-v2-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ inputs.perfil }}-${{
                  hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-${{ steps.origem.outputs.commit }}
              restore-keys: |
                  rust-v2-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ inputs.perfil }}-
